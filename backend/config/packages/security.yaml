# config/packages/security.yaml

security:
    # Configuración del codificador de contraseñas
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User:
            algorithm: auto

    # Proveedores de usuarios
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Configuración de firewalls
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        
        # Add reviews/generate to the public routes
        # In the public_api section, add the restaurants/generate path
        public_api:
            pattern: ^/api/(accommodations|login|register|reviews/generate|restaurants/generate)
            security: false
        
        # Main API firewall
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~
        
        main:
            lazy: true
            provider: app_user_provider
            # Otras configuraciones del firewall principal

    # Control de acceso
    # In your security.yaml file, add the reviews/generate path to the public access routes
    access_control:
        - { path: ^/api/restaurants, roles: PUBLIC_ACCESS }
        - { path: ^/api/experiences, roles: PUBLIC_ACCESS }
        - { path: ^/api/accommodations, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
